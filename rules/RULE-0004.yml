uid: RULE-0004
type: rule
status: proposed
title: Every item in a standard records where it came from
text: Every intent, constraint, rule, example and non_goal may record origin, one
  of human, ai or hybrid. An item an assistant wrote is checked as awaiting a person's
  signature.
rationale: Declared in throughline.toml on each of the five types as attrs.origin
  = {type = "enum", values = ["human", "ai", "hybrid"]}; ai and hybrid are the graph's
  ai_origins.
normative: true
links:
- target: INT-0001
  type: derives_from
attrs:
  origin: ai
