# The throughline meta-standard: the registers, attributes, links and link types
# every standard declares its followers' shape with, held as items, and the base
# types every consumer of a standard implements. It follows itself: having no
# schema source, every declaration it holds applies to it (throughline SR-0285).
[project]
name = "Throughline meta-standard"
format_version = 4
suggested_namespace = "meta"
meta_standard = 1

[grounding]
root_types = ["intent"]
delivery_roots = ["intent"]
ai_origins = ["ai", "hybrid"]

[status]
# Retired by `tl migrate` (SR-0313): draft stood between proposal and
# signature. Every item is born proposed and counts only once a person signs it
# (UR-0046).
values = ["proposed", "ratified", "suspect", "rejected", "deleted"]

[status.roles]
initial = "proposed"
proposed = "proposed"
ratified = "ratified"
invalidated = "rejected"
suspect = "suspect"
tombstone = "deleted"

[types.intent]
normative = false

[links]
# Declared by `tl migrate` (SR-0185) as the link types this project already
# relies on, because an undeclared vocabulary permits every value and so
# validates none of them. Narrow it deliberately with `tl schema` once you have
# decided what it should be.
types = ["aliases", "belongs_to", "derives_from", "from", "has_type", "to",
         "via"]
