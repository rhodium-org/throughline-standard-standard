name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "throughline>=4.4.0"
      - run: tl check
      - uses: rhodium-org/throughline-standard-standard@v1.0.0
