uid: CONS-0003
type: constraint
status: proposed
title: The constraint pattern
text: 'The whole value matches this pattern. Only this subset, which reads the same
  in Python and JavaScript: ^ and $ at the ends, literal characters, [abc] [a-z]
  [^a-z], ., ? * + {m} {m,n}, | and ( ). Refused: \d \w \s \b (they differ between
  languages), lookaround, backreferences, flags.'
normative: true
links:
- target: BASE-0001
  type: derives_from
attrs:
  name: pattern
  meaning: 'The whole value matches this pattern. Only this subset, which reads the
    same in Python and JavaScript: ^ and $ at the ends, literal characters, [abc]
    [a-z] [^a-z], ., ? * + {m} {m,n}, | and ( ). Refused: \d \w \s \b (they differ
    between languages), lookaround, backreferences, flags.'
  valid: |-
    ^[0-9]{4}-(0[1-9]|1[0-2])$
    ^https?://[^ ]+$
  invalid: |-
    ^\d{4}$
    (?i)^abc$
    ^(?=a)
  origin: ai
